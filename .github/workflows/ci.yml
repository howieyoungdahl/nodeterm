name: CI

# Verify typecheck, tests, and the production build on every PR and push to main, and on the
# fork's integration branches: the browser server on the canvas host is updated from
# integration/server-fixes-*, so a PR into it needs a check before auto-merge can trust it.
on:
  pull_request:
    branches: [main, 'integration/**', 'feat/oct4-operational-release']
  push:
    branches: [main, 'integration/**']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (electron-vite)
        run: npm run build

  # Windows is becoming a supported target (extraction from #276). The full suite still contains
  # POSIX-shaped fixtures (/bin/sh, AF_UNIX binds), so this job runs the suites whose behaviour is
  # platform-dependent and worth proving on the real platform — the atomic-write retry exists FOR
  # Windows and is inert on the Linux job above. Widen the file list as Windows support lands
  # (session host, shell profiles); the goal is that it converges on `npm test`.
  quality-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build session host
        run: npm run host:build

      - name: Windows-relevant tests
        run: npx vitest run src/core/fs-atomic.test.ts src/core/fs-atomic.guard.test.ts src/session-host/ src/core/session-host-client.test.ts src/core/session-host-launch-ledger.test.ts src/core/agent-launch.test.ts src/core/pty-session-host.test.ts src/main/media-protocol.test.ts src/main/remote-atomic-write.test.ts src/main/ssh-fs.test.ts src/main/remote-ssh/ssh-project.test.ts src/renderer/terminal/file-links.test.ts src/renderer/terminal/file-links.windows.test.ts src/renderer/terminal/file-link-dialect.test.ts src/renderer/terminal/host-platform.test.ts src/core/operator-conversation.test.ts src/core/operator-session-bindings.test.ts src/core/agents/operator-messaging.test.ts src/core/agents/operator-delivery.test.ts src/core/agents/operator-codex-generation.test.ts src/core/agents/submitted-prompt.test.ts src/core/agents/hook-verified-parity.test.ts src/shared/agents/normalize.test.ts src/server/operator-conversation-api.test.ts src/server/operator-conversation-policy.test.ts src/server/operator-receipts.test.ts src/server/settled-envelope.test.ts src/server/node-ownership-store.test.ts src/core/kanban-organization.test.ts test/acceptance/kanban-organization.test.ts test/acceptance/organization-client.test.ts test/acceptance/operator-cli.test.ts test/server/operator-access-coverage.test.ts src/server/assistant-creation-receipts.test.ts src/core/workspace-publication-platform.test.ts src/core/workspace-publication-native-windows.test.ts src/core/workspace-store.rescue.test.ts src/core/session-cleanup.test.ts src/core/project-commit-store.test.ts src/shared/task-planning.test.ts src/renderer/lib/taskBoardVisibility.test.ts src/renderer/lib/kanban.test.ts src/renderer/components/kanban/SessionCard.taskPlanning.test.tsx
